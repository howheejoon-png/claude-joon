# Builds Mahjong Tally (mahjong-tally/) and publishes it to GitHub Pages:
#   https://howheejoon-png.github.io/claude-joon/
# Runs on every push to master that touches the app, or manually from the Actions tab.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy Mahjong Tally

on:
  push:
    branches: [master]
    paths:
      - 'mahjong-tally/**'
      - '.github/workflows/deploy-mahjong-tally.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mahjong-tally
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mahjong-tally/package-lock.json
      - run: npm ci
      # Never publish a build whose scoring tests fail.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: mahjong-tally/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
